<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b1a6b">
<title>Derek &amp; Elliot's Star Catch &amp; Huggle Bears</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;background:#2b1a6b;
    font-family:"Arial Rounded MT Bold","Nunito","Trebuchet MS",system-ui,-apple-system,sans-serif;color:#fff}
  #game{position:fixed;inset:0;display:block;width:100%;height:100%}
  #sab{position:fixed;left:0;bottom:0;width:1px;height:env(safe-area-inset-bottom);pointer-events:none;visibility:hidden}
  .hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 14px 0;display:flex;gap:8px;align-items:center;justify-content:space-between;pointer-events:none;z-index:5}
  .pill{background:rgba(255,255,255,.18);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:999px;padding:8px 14px;font-size:20px;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.15);white-space:nowrap}
  .btn-round{pointer-events:auto;border:0;width:48px;height:48px;border-radius:50%;font-size:24px;background:rgba(255,255,255,.22);color:#fff;cursor:pointer}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:10;
    background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.12),transparent 60%)}
  .hidden{display:none!important}
  h1{margin:0 0 6px;font-size:clamp(34px,10vw,54px);line-height:1.02;letter-spacing:.5px;
    text-shadow:0 4px 0 #e0457b,0 8px 18px rgba(0,0,0,.35);animation:bob 2.4s ease-in-out infinite}
  h1 .amp{color:#ffd23f}
  .sub{font-size:20px;opacity:.95;margin:4px 0 22px}
  .pick{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
  .kid{border:0;border-radius:28px;padding:16px 14px 14px;width:150px;color:#fff;font-size:24px;font-weight:900;cursor:pointer;
    box-shadow:0 7px 0 rgba(0,0,0,.25);transition:transform .12s;font-family:inherit}
  .kid:active{transform:translateY(5px) scale(.97);box-shadow:0 2px 0 rgba(0,0,0,.25)}
  .kid canvas{width:110px;height:110px;display:block;margin:0 auto 6px}
  .derek{background:linear-gradient(#4a6fd1,#22306a)}
  .elliot{background:linear-gradient(#e0704f,#9a3a24)}
  .big{border:0;border-radius:999px;padding:16px 34px;font-size:26px;font-weight:900;color:#5a2a00;font-family:inherit;
    background:linear-gradient(#ffe066,#ffb703);box-shadow:0 7px 0 #c97d00;cursor:pointer;margin-top:14px}
  .big:active{transform:translateY(5px);box-shadow:0 2px 0 #c97d00}
  .link{margin-top:16px;background:none;border:2px solid rgba(255,255,255,.6);color:#fff;border-radius:999px;padding:10px 20px;font-size:18px;font-weight:800;font-family:inherit;cursor:pointer}
  .tip{margin-top:20px;font-size:16px;opacity:.85}
  .modes{display:flex;gap:8px;margin:2px 0 12px;background:rgba(0,0,0,.2);padding:5px;border-radius:999px}
  .mode{border:0;border-radius:999px;padding:10px 16px;font-size:18px;font-weight:900;font-family:inherit;color:#fff;background:transparent;cursor:pointer}
  .mode.on{background:#ffd23f;color:#5a2a00;box-shadow:0 3px 0 #c97d00}
  #cheer{position:fixed;left:0;right:0;top:38%;text-align:center;font-size:clamp(40px,12vw,70px);font-weight:900;z-index:6;pointer-events:none;
    color:#ffd23f;text-shadow:0 5px 0 #e0457b,0 10px 24px rgba(0,0,0,.4);opacity:0;transform:scale(.4)}
  #cheer.show{animation:pop 1.6s ease-out forwards}
  #cheer small{display:block;font-size:.45em;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25)}
  .final{font-size:72px;font-weight:900;color:#ffd23f;text-shadow:0 5px 0 #e0457b;margin:6px 0}
  .stars{font-size:40px;letter-spacing:6px;margin:4px 0 6px}
  .turn{font-size:22px;margin:6px 0;opacity:.95}
  #caption{position:fixed;left:12px;right:110px;bottom:calc(env(safe-area-inset-bottom) + 22px);z-index:6;pointer-events:none;text-align:center;
    font-size:17px;font-weight:900;line-height:1.2;padding:10px 14px;border-radius:20px;background:rgba(30,16,70,.62);opacity:0;transition:opacity .5s;text-shadow:0 2px 0 rgba(0,0,0,.3)}
  #caption.on{opacity:1}
  #growl{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:7;width:88px;height:88px;border-radius:50%;border:0;
    background:radial-gradient(circle at 40% 35%,#c98a55,#7a4a26);color:#fff;font-family:inherit;font-weight:900;font-size:17px;line-height:1.05;
    box-shadow:0 6px 0 #4e2e14,0 8px 20px rgba(0,0,0,.35);cursor:pointer}
  #growl b{display:block;font-size:30px}
  #growl:active{transform:translateY(4px);box-shadow:0 2px 0 #4e2e14}
  #growl.pulse{animation:pulse .5s ease-in-out infinite alternate}
  #bedtime{justify-content:flex-start;background:none;padding-top:calc(env(safe-area-inset-top) + 34px);padding-bottom:calc(env(safe-area-inset-bottom) + 20px)}
  #bedtime h1{font-size:clamp(28px,8.4vw,44px);text-shadow:0 3px 0 #b5527a,0 6px 18px rgba(0,0,0,.5);animation:none}
  .fade{opacity:0;transition:opacity 1.6s}
  .fade.in{opacity:1}
  #bedBtns{margin-top:auto;background:rgba(20,10,50,.55);border-radius:26px;padding:12px 18px 14px}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.13);box-shadow:0 6px 0 #4e2e14,0 0 26px #ffd23f}}
  @keyframes pop{0%{opacity:0;transform:scale(.4) rotate(-6deg)}18%{opacity:1;transform:scale(1.15) rotate(3deg)}30%{transform:scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:scale(1.05) translateY(-30px)}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="sab"></div>

<div class="hud hidden" id="hud">
  <div class="pill" id="score">⭐ 0</div>
  <div class="pill" id="level">Lv 1</div>
  <div class="pill" id="time">⏱ 60</div>
  <button class="btn-round" id="mute2" aria-label="Sound">🔊</button>
</div>
<div id="cheer"></div>
<div id="caption"></div>
<button id="growl" class="hidden" aria-label="Growl"><b>🐻</b>Growl!</button>

<div class="screen" id="start">
  <div class="modes"><button class="mode on" id="mStar">⭐ Star Catch</button><button class="mode" id="mBear">🐻 Huggle Bear</button></div>
  <h1 id="title">Derek <span class="amp">&amp;</span> Elliot's<br>Star Catch</h1>
  <div class="sub" id="pickMsg">Who's catching stars today?</div>
  <div class="pick">
    <button class="kid derek" data-kid="Derek"><canvas id="pvD" width="220" height="220"></canvas>Derek</button>
    <button class="kid elliot e" data-kid="Elliot"><canvas id="pvE" width="220" height="220"></canvas>Elliot</button>
  </div>
  <button class="link" id="twoP">👫 Take turns (2 players)</button>
  <button class="link" id="mute1">🔊 Sound on</button>
  <div class="tip" id="tip">Drag or tap to move. Catch everything you can!</div>
</div>

<div class="screen hidden" id="between">
  <div class="turn" id="betweenMsg"></div>
  <h1 id="betweenName">Elliot's turn!</h1>
  <button class="big" id="goNext">Let's go! 🚀</button>
</div>

<div class="screen hidden" id="end">
  <h1 id="endTitle">Amazing!</h1>
  <div class="stars" id="endStars">⭐⭐⭐</div>
  <div class="final" id="endScore">0</div>
  <div class="sub" id="endMsg">things caught!</div>
  <button class="big" id="again">Play again! 🎉</button>
  <button class="link" id="menu">Pick a player</button>
</div>

<div class="screen hidden" id="bedtime">
  <h1 class="fade" id="bedT1">We're huggle bears forever…</h1>
  <div class="sub fade" id="bedT2" style="margin:6px 0 0">Sweet dreams, little cubs 🌙</div>
  <div id="bedBtns" class="fade">
    <div class="turn" id="bedMsg"></div>
    <button class="big" id="bedAgain">Play again 🐻</button><br>
    <button class="link" id="bedMenu">Pick a player</button>
  </div>
</div>
<script>
(function(){
"use strict";
const KIDS={
  Derek:{cheer:["Go Derek!","Wow, Derek!","Super Derek!","Derek rocks!","Star power, Derek!"]},
  Elliot:{cheer:["Go Elliot!","Wow, Elliot!","Super Elliot!","Elliot rocks!","Star power, Elliot!"]}
};
const FONT=getComputedStyle(document.body).fontFamily;

// ---------- Cartoon family (drawn in code) ----------
const LOOK={
  Derek:{hair:"#e2a05c",hairDk:"#c17a3a",shirt:"#22305e",shirtDk:"#172349",pants:"#cdb083",shoe:"#1d2a55",sole:"#f4f4f4",skin:"#ffdcc4",curly:true,grin:"big",sc:1},
  Elliot:{hair:"#f4da92",hairDk:"#d6b562",shirt:"#a9442d",shirtDk:"#83301d",pants:"#9fc4e8",shoe:"#1c1c1f",sole:"#d8d8d8",skin:"#ffdcc4",curly:false,grin:"goofy",sc:.93}
};
const FUR="#9a6234",FURDK="#6e4322",FURIN="#f2b3a0",INK="#2a1a10";
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function circ(c,x,y,r,col){c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,7);c.fill();}
function ell(c,x,y,rx,ry,col,rot){c.fillStyle=col;c.beginPath();c.ellipse(x,y,rx,ry,rot||0,0,7);c.fill();}
function blinkAt(t,seed){return ((t+seed)%3.6)<.13;}
function bearEar(c,x,y,r){circ(c,x,y,r,FUR);circ(c,x,y+r*.12,r*.55,FURIN);}
function paw(c,x,y,r){circ(c,x,y,r,FUR);circ(c,x,y+r*.25,r*.42,FURIN);for(let i=-1;i<=1;i++)circ(c,x+i*r*.42,y-r*.38,r*.18,FURIN);}
function eyes(c,x1,x2,y,o,happyClosed){
  c.strokeStyle=INK;c.lineCap="round";c.lineWidth=2.4;
  if(o.sleepy){for(const x of [x1,x2]){c.beginPath();c.arc(x,y-1,3.6,.2*Math.PI,.8*Math.PI);c.stroke();}return;}
  if(o.blink){for(const x of [x1,x2]){c.beginPath();c.moveTo(x-3.4,y);c.lineTo(x+3.4,y);c.stroke();}return;}
  for(const x of [x1,x2]){ell(c,x,y,3.3,3.9,INK);circ(c,x+1.1,y-1.4,1.2,"#fff");}
}
function drawKidHead(c,kid,o){const L=LOOK[kid];
  circ(c,-21,2,5,L.skin);circ(c,21,2,5,L.skin);
  circ(c,0,0,22,L.skin);
  if(L.curly){
    const pts=[[-20,-5,7],[-18,-13,8],[-11,-19,8],[-2,-22,8.5],[7,-21,8],[14,-17,8],[19,-10,7.5],[21,-3,6],[-6,-14,7],[5,-13,7],[-14,-9,6],[13,-9,6]];
    for(const p of pts)circ(c,p[0],p[1],p[2],L.hair);
    c.strokeStyle=L.hairDk;c.lineWidth=1.6;c.lineCap="round";
    for(const p of pts.slice(0,8)){c.beginPath();c.arc(p[0],p[1],p[2]*.5,.4,2.6);c.stroke();}
  }else{
    c.fillStyle=L.hair;c.beginPath();c.arc(0,-1,23.5,Math.PI*1.02,Math.PI*1.98);
    c.lineTo(22,-3);c.lineTo(15,-8);c.lineTo(9,-5);c.lineTo(3,-10);c.lineTo(-4,-6);c.lineTo(-10,-10);c.lineTo(-16,-5);c.lineTo(-22,-3);c.closePath();c.fill();
    c.strokeStyle=L.hairDk;c.lineWidth=1.4;c.beginPath();c.moveTo(-6,-21);c.quadraticCurveTo(-2,-14,-3,-9);c.moveTo(8,-20);c.quadraticCurveTo(10,-13,9,-7);c.stroke();
  }
  if(o.bear){bearEar(c,-16,-24,8.5);bearEar(c,16,-24,8.5);}
  eyes(c,-8,8,0,o);
  ell(c,-14,8,4,2.8,"rgba(255,120,140,.45)");ell(c,14,8,4,2.8,"rgba(255,120,140,.45)");
  if(o.bear){ell(c,0,6,3,2.2,"#5a3420");}
  if(o.sleepy){c.strokeStyle=INK;c.lineWidth=2;c.beginPath();c.arc(0,10,3.5,.15*Math.PI,.85*Math.PI);c.stroke();return;}
  if(L.grin==="big"){c.fillStyle="#7a2a2a";c.beginPath();c.moveTo(-9,9);c.quadraticCurveTo(0,21,9,9);c.closePath();c.fill();
    c.fillStyle="#fff";c.fillRect(-6,9,12,2.6);}
  else{c.fillStyle="#7a2a2a";c.beginPath();c.moveTo(-9,10);c.quadraticCurveTo(1,19,11,7);c.quadraticCurveTo(1,12,-9,10);c.fill();
    ell(c,4,13.2,3.2,2,"#ff7d8f");}
}
function kidLeg(c,x,a,L){c.save();c.translate(x,-30);c.rotate(a);c.fillStyle=L.pants;rr(c,-5,0,10,26,4);c.fill();
  ell(c,1.5,27,7,4.5,L.shoe);c.fillStyle=L.sole;c.fillRect(-5,29.2,13,1.8);c.restore();}
function kidArm(c,x,a,L,bear){c.save();c.translate(x,-54);c.rotate(a);c.fillStyle=L.shirt;rr(c,-5,-2,10,12,4);c.fill();
  c.fillStyle=L.skin;rr(c,-3.5,8,7,11,3);c.fill();if(bear)paw(c,0,21,6.5);else circ(c,0,20,4.6,L.skin);c.restore();}
// kid: origin at feet, ~102 units tall
function drawKid(c,kid,o){const L=LOOK[kid],t=o.t||0,run=o.run||0,sw=Math.sin(t*14)*run*.65;
  c.save();c.scale(L.sc,L.sc);
  ell(c,0,1,20,4,"rgba(0,0,0,.18)");
  const bob=run>.05?-Math.abs(Math.sin(t*14))*3.5*run:Math.sin(t*2.6+(o.seed||0))*1.3-(o.happy?Math.abs(Math.sin(t*12))*5:0);
  c.translate(0,bob);
  kidLeg(c,-6,sw,L);kidLeg(c,6,-sw,L);
  if(o.bear)circ(c,0,-34,6,FUR);
  const up=o.happy?2.5:0;
  kidArm(c,-15,.22+sw*.8+up,L,o.bear);kidArm(c,15,-.22-sw*.8-up,L,o.bear);
  c.fillStyle=L.shirt;rr(c,-16,-58,32,30,11);c.fill();c.fillStyle=L.shirtDk;c.fillRect(-14,-33,28,4);
  if(kid==="Derek"){c.fillStyle="#d8b44a";c.font="bold 7px sans-serif";c.textAlign="center";c.fillText("~*~",8,-45);}
  c.save();c.translate(0,-80);c.rotate(Math.sin(t*2+(o.seed||0))*.04);drawKidHead(c,kid,o);c.restore();
  c.restore();
}
// Papa Bear on all fours, facing right, origin at feet center
const HOOD="#2c2f36",HOOD2="#202228",PANTS="#1f2228",SKIN="#f6d2b6",BEARD="#3b2a20",CAP="#23262c";
function papaLimb(c,x,y,a,col){c.save();c.translate(x,y);c.rotate(a);c.fillStyle=col;rr(c,-6,0,12,-y-6,5);c.fill();ell(c,1,-y-5,9,6,FUR);ell(c,4,-y-4,3.5,2.4,FURIN);c.restore();}
function drawPapaHead(c,o,human){
  circ(c,-5,3,23,HOOD);
  circ(c,0,0,18,SKIN);
  c.fillStyle=BEARD;c.beginPath();c.ellipse(2,5,18.5,16,0,-.12,Math.PI+.12);c.closePath();c.fill();
  circ(c,-11,-1,4,SKIN);
  circ(c,17,1,3.4,"#eab89a");
  c.strokeStyle="#d77";c.lineWidth=2;c.lineCap="round";c.beginPath();c.arc(9,10,3.5,.2,Math.PI-.4);c.stroke();
  // eyes + glasses
  const ex=[4,13];
  if(o.sleepy){c.strokeStyle=INK;c.lineWidth=2;for(const x of ex){c.beginPath();c.arc(x,-3,2.6,.2*Math.PI,.8*Math.PI);c.stroke();}}
  else if(o.blink){c.strokeStyle=INK;c.lineWidth=2;for(const x of ex){c.beginPath();c.moveTo(x-2.4,-3);c.lineTo(x+2.4,-3);c.stroke();}}
  else for(const x of ex)circ(c,x,-3,2.3,INK);
  c.strokeStyle="#111";c.lineWidth=1.8;for(const x of ex){c.beginPath();c.arc(x,-3,5,0,7);c.stroke();}
  c.beginPath();c.moveTo(-1,-3);c.lineTo(-10,-4);c.moveTo(8.5,-4);c.lineTo(9,-4);c.stroke();
  // cap
  c.fillStyle=CAP;c.beginPath();c.arc(0,-6,19,Math.PI,0);c.closePath();c.fill();
  ell(c,17,-7,12,3.6,CAP);circ(c,0,-25,2.2,"#3a3e47");
  if(!human){bearEar(c,-10,-22,7);bearEar(c,8,-23,7);}
}
function drawPapaBear(c,o){const t=o.t||0,run=o.run||0,sw=Math.sin(t*10)*run*.5,bob=run>.05?-Math.abs(Math.sin(t*10))*3:Math.sin(t*2)*1.2;
  ell(c,0,1,52,6,"rgba(0,0,0,.2)");
  papaLimb(c,-30,-40,-sw,"#16181c");papaLimb(c,30,-42,sw,HOOD2);
  c.save();c.translate(0,bob+(o.lie?14:0));
  circ(c,-46,-50,7,FUR);
  ell(c,-2,-46,44,19,HOOD);ell(c,6,-40,30,8,"#353942");
  c.restore();
  papaLimb(c,-26,-38,sw,PANTS);papaLimb(c,34,-40,-sw,HOOD);
  c.save();c.translate(48,-62+bob+(o.lie?16:0));c.rotate(o.lie?.15:Math.sin(t*2.3)*.05);drawPapaHead(c,o,false);c.restore();
}
// Mama: standing, origin at feet, ~125 units tall
const MHAIR="#7b3f25",MHAIRDK="#5e2d18",VEST="#8b5a36",TOP="#1d1d22",JEANS="#9fc4e8";
function drawMama(c,o){const t=o.t||0,run=o.run||0,sw=Math.sin(t*11)*run*.55;
  ell(c,0,1,22,4.5,"rgba(0,0,0,.18)");
  const bob=run>.05?-Math.abs(Math.sin(t*11))*3*run:Math.sin(t*2.2+1)*1.2-(o.happy?Math.abs(Math.sin(t*12))*5:0);
  c.save();c.translate(0,bob);
  for(const [x,a] of [[-6,sw],[6,-sw]]){c.save();c.translate(x,-40);c.rotate(a);c.fillStyle=JEANS;rr(c,-5.5,0,11,37,4);c.fill();ell(c,1.5,38,7,4.2,"#2a2a2e");c.restore();}
  if(o.bear)circ(c,0,-44,6,FUR);
  const up=o.happy?2.5:0;
  for(const [x,a] of [[-16,.2+sw+up],[16,-.2-sw-up]]){c.save();c.translate(x,-72);c.rotate(a);c.fillStyle=TOP;rr(c,-4.5,-2,9,26,4);c.fill();if(o.bear)paw(c,0,27,6.5);else circ(c,0,26,4.5,SKIN);c.restore();}
  c.fillStyle=MHAIR;rr(c,-23,-114,46,50,18);c.fill();
  c.fillStyle=TOP;rr(c,-16,-76,32,40,10);c.fill();
  c.fillStyle=VEST;rr(c,-16,-76,11,40,6);c.fill();rr(c,5,-76,11,40,6);c.fill();
  c.fillStyle=JEANS;c.fillRect(-16,-40,32,6);
  c.save();c.translate(0,-96);c.rotate(Math.sin(t*1.8)*.04);
  circ(c,0,0,20,SKIN);
  c.fillStyle=MHAIR;c.beginPath();c.arc(0,-1,21.5,Math.PI*1.02,Math.PI*1.98);c.quadraticCurveTo(10,-14,-4,-12);c.quadraticCurveTo(-14,-10,-21,2);c.closePath();c.fill();
  c.strokeStyle=MHAIRDK;c.lineWidth=1.4;c.beginPath();c.moveTo(-14,-14);c.quadraticCurveTo(-4,-20,10,-17);c.stroke();
  ell(c,-8,-18,6,3.4,"#1a1a1a");ell(c,8,-18,6,3.4,"#1a1a1a");c.fillStyle="#1a1a1a";c.fillRect(-3,-19,6,1.6);
  if(o.bear){bearEar(c,-16,-21,7.5);bearEar(c,16,-21,7.5);}
  if(o.sleepy){c.strokeStyle=INK;c.lineWidth=2.2;for(const x of [-7,7]){c.beginPath();c.arc(x,1,3.2,1.2*Math.PI,1.8*Math.PI);c.stroke();}}
  else eyes(c,-7,7,0,o);
  ell(c,-13,7,3.6,2.5,"rgba(255,120,140,.45)");ell(c,13,7,3.6,2.5,"rgba(255,120,140,.45)");
  c.fillStyle="#9a2f3a";c.beginPath();c.moveTo(-7,8);c.quadraticCurveTo(0,17,7,8);c.closePath();c.fill();
  c.restore();c.restore();
}

let actx=null,muted=false,lull=null;
function ac(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(actx&&actx.state==="suspended")actx.resume();return actx;}
function tone(f,t0,dur,type,vol,slide){const a=ac();if(!a||muted)return;const o=a.createOscillator(),g=a.createGain();o.type=type||"sine";
  const t=a.currentTime+t0;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.2,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.05);}
function growlNote(f0,f1,dur,vol,lp,trem,t0){const a=ac();if(!a||muted)return;const t=a.currentTime+(t0||0);
  const o=a.createOscillator(),f=a.createBiquadFilter(),g=a.createGain(),l=a.createOscillator(),lg=a.createGain();
  o.type="sawtooth";o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  f.type="lowpass";f.frequency.value=lp;f.Q.value=3;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.07);g.gain.setValueAtTime(vol,t+dur*.6);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  l.frequency.value=trem;lg.gain.value=vol*.45;l.connect(lg);lg.connect(g.gain);
  o.connect(f);f.connect(g);g.connect(a.destination);o.start(t);l.start(t);o.stop(t+dur+.05);l.stop(t+dur+.05);}
const SFX={
  star(n){const base=[523,587,659,784,880][n%5];tone(base,0,.18,"triangle",.22);tone(base*1.5,.06,.22,"sine",.15);},
  heart(){tone(660,0,.15,"sine",.22);tone(880,.1,.25,"sine",.2);},
  silly(){tone(300,0,.35,"square",.08,900);tone(200,.05,.3,"triangle",.12,120);},
  level(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.25,"triangle",.2));},
  end(){[392,523,659,784,659,784,1047].forEach((f,i)=>tone(f,i*.12,.3,"triangle",.2));},
  tap(){tone(440,0,.08,"sine",.12);},
  cub(t0){growlNote(430,300,.45,.16,1500,26,t0);},
  papa(t0){growlNote(118,78,.9,.32,480,15,t0);},
  hug(){tone(660,0,.25,"sine",.18);tone(880,.12,.3,"sine",.16);tone(1047,.24,.4,"sine",.14);growlNote(300,240,.35,.07,900,22,.1);},
  poof(){tone(280,0,.22,"sine",.18,520);},

};
// Original gentle lullaby (3/4 time, music-box style)
function playLullaby(){stopLullaby();const a=ac();if(!a)return;const g=a.createGain();g.gain.value=muted?0:1;g.connect(a.destination);lull=g;
  const N={C3:130.81,E3:164.81,F3:174.61,G3:196,A3:220,C4:261.63,D4:293.66,E4:329.63,G4:392,A4:440,B4:493.88,C5:523.25};
  const mel=[["E4",2],["G4",1],["A4",2],["G4",1],["E4",1],["D4",1],["C4",1],["D4",3],["E4",2],["G4",1],["C5",2],["B4",1],["A4",1],["G4",1],["E4",1],["G4",3],
    ["A4",2],["C5",1],["B4",2],["G4",1],["A4",1],["G4",1],["E4",1],["D4",3],["E4",2],["D4",1],["C4",2],["E4",1],["D4",1],["E4",1],["D4",1],["C4",3]];
  const bass=["C3","F3","C3","G3","C3","G3","A3","E3","F3","G3","C3","G3","C3","A3","G3","C3"];
  const beat=.62,t0=a.currentTime+.3;
  function n(f,t,d,v,type){const o=a.createOscillator(),gg=a.createGain();o.type=type;o.frequency.value=f;gg.gain.setValueAtTime(.0001,t);
    gg.gain.exponentialRampToValueAtTime(v,t+.06);gg.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gg);gg.connect(g);o.start(t);o.stop(t+d+.05);}
  for(let pass=0;pass<2;pass++){const base=t0+pass*48*beat,oct=pass?2:1,vol=pass?.06:.1;let tb=0;
    for(const [k,b] of mel){const t=base+tb*beat;n(N[k]*oct,t,b*beat+.5,vol,"sine");n(N[k]*oct*2,t,b*beat*.6+.2,vol*.25,"triangle");tb+=b;}
    bass.forEach((k,i)=>n(N[k],base+i*3*beat,3*beat+.3,.06,"sine"));}
}

function starPath(x,y,r,ri,pts){cx.beginPath();for(let i=0;i<pts*2;i++){const rr=i%2?ri:r,a=i*Math.PI/pts-Math.PI/2;cx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}cx.closePath();}

let tt=0;
function drawBG(dt){

  cx.globalAlpha=1;
  cx.fillStyle="#fff6c9";cx.shadowColor="#fff6c9";cx.shadowBlur=30;cx.beginPath();cx.arc(W*.82,H*.16,Math.min(W,H)*.07,0,7);cx.fill();cx.shadowBlur=0;
  for(let i=0;i<3;i++){const x=((tt*(12+i*6)+i*W*.4)%(W+200))-100,y=H*(.28+i*.13);cx.fillStyle="rgba(255,255,255,.16)";

  const gh=groundH();cx.fillStyle="#3cc46a";cx.beginPath();cx.moveTo(0,H);cx.lineTo(0,H-gh);

function drawFX(dt){

function loop(ts){

  drawPickers();

  drawBG(dt);

    timeLeft=(endAt-ts)/1000;if(timeLeft<=0){timeLeft=0;finishRound();}

    document.getElementById("time").textContent="⏱ "+Math.ceil(timeLeft);
  }
  const dx=player.tx-player.x;player.x+=dx*Math.min(1,dt*14);if(Math.abs(dx)>2)player.face=dx<0?-1:1;
  const ps=player.size,catchY=player.y-ps*.05;
  for(let i=items.length-1;i>=0;i--){const it=items[i];it.y+=it.vy*dt;it.wob+=dt*3;it.x+=Math.sin(it.wob)*it.vx*dt;it.rot+=it.vr*dt;
    if(state==="play"&&it.y>catchY-ps*.55&&it.y<catchY+ps*.35&&Math.abs(it.x-player.x)<ps*.5+it.s*.35){items.splice(i,1);caught(it);continue;}
    if(it.y>H+it.s){items.splice(i,1);caughtStreak=0;continue;}
    cx.save();cx.translate(it.x,it.y);
    if(it.t.k==="star")cx.rotate(Math.sin(it.rot)*.4),drawStar(it.s,"#ffd23f",true);
    else if(it.t.k==="bigstar"){cx.rotate(it.rot);drawStar(it.s,`hsl(${(tt*200)%360},100%,65%)`,true);}
    else if(it.t.k==="heart"){const pul=1+Math.sin(tt*8)*.08;cx.scale(pul,pul);drawHeart(it.s,"#ff5d8f");}
    else{cx.rotate(Math.sin(it.rot)*.5);cx.font=it.s+"px system-ui,Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif";cx.textAlign="center";cx.textBaseline="middle";cx.fillText(it.emoji,0,0);}
    cx.restore();}
  drawPlayer(dt);
  drawFX(dt);

}

  // lamp glow
  const lx=W*.9,ly=H*.48;const rg=cx.createRadialGradient(lx,ly,5,lx,ly,W*.9);rg.addColorStop(0,`rgba(255,200,90,${.55*glow})`);rg.addColorStop(.5,`rgba(255,180,80,${.18*glow})`);rg.addColorStop(1,"rgba(255,170,70,0)");
  cx.fillStyle=rg;cx.fillRect(0,0,W,H);
  // Mama behind the bed, Papa bear by the bed
  const S=cs()*.95,bx=W*.2,bw=W*.6,by=H*.42;
  // bed
  cx.fillStyle="#7a4a28";rr(cx,bx,by-H*.07,bw,H*.12,26);cx.fill();cx.fillStyle="#8f5a33";rr(cx,bx+10,by-H*.06,bw-20,H*.05,18);cx.fill();
  ell(cx,bx+bw*.3,by+H*.035,bw*.17,H*.028,"#fdf7ee");ell(cx,bx+bw*.7,by+H*.035,bw*.17,H*.028,"#fdf7ee");
  const hs=1.25*cs();for(const [k,px] of [["Derek",.32],["Elliot",.68]]){cx.save();cx.translate(bx+bw*px,by+H*.03);cx.scale(hs,hs);cx.rotate(k==="Derek"?-.12:.12);drawKidHead(cx,k,{bear:true,sleepy:true});cx.restore();}
  // quilt like a cave
  const qt=by+H*.05,qb=fy-6;cx.save();cx.beginPath();cx.moveTo(bx-6,qb);cx.lineTo(bx-6,qt+20);cx.quadraticCurveTo(bx+bw/2,qt-24,bx+bw+6,qt+20);cx.lineTo(bx+bw+6,qb);cx.closePath();cx.clip();
  const qc=["#f6b04a","#e9845f","#f3d27a","#c76f8f","#7fb3d5","#f6b04a"];const q=24;for(let i=0;i*q<bw+20;i++)for(let j=0;j*q<qb-qt+30;j++){cx.fillStyle=qc[(i*2+j)%qc.length];cx.fillRect(bx-6+i*q,qt-24+j*q,q+1,q+1);}
  cx.strokeStyle="rgba(255,255,255,.35)";cx.setLineDash([4,4]);cx.lineWidth=1.5;for(let i=0;i*q<bw+20;i++){cx.beginPath();cx.moveTo(bx-6+i*q,qt-30);cx.lineTo(bx-6+i*q,qb);cx.stroke();}cx.setLineDash([]);cx.restore();
  cx.fillStyle="#6b3f22";cx.fillRect(bx,qb,10,10);cx.fillRect(bx+bw-10,qb,10,10);
  // nightstand + lamp
  cx.fillStyle="#8a5a33";rr(cx,W*.82,ly+10,W*.16,fy-ly-10,6);cx.fill();cx.fillStyle="#6b4226";cx.fillRect(W*.84,ly+30,W*.12,4);
  cx.fillStyle="#d9b98a";cx.fillRect(lx-3,ly-20,6,30);ell(cx,lx,ly+10,12,4,"#b8956a");
  cx.fillStyle=`rgb(${Math.round(160+95*glow)},${Math.round(130+80*glow)},${Math.round(80+20*glow)})`;cx.beginPath();cx.moveTo(lx-16,ly-18);cx.lineTo(lx+16,ly-18);cx.lineTo(lx+10,ly-40);cx.lineTo(lx-10,ly-40);cx.closePath();cx.fill();
  // Papa bear sleeping on the rug in front
  cx.save();cx.translate(W*.1,fy+6);cx.scale(S,S);drawMama(cx,{t:tt,bear:true,sleepy:true});cx.restore();
  cx.save();cx.translate(W*.8,fy+12);cx.scale(-cs()*.8,cs()*.8);drawPapaBear(cx,{t:tt,lie:true,sleepy:true});cx.restore();
  // Zzz
  for(let i=0;i<3;i++){const p=((T*.35+i/3)%1);cx.globalAlpha=Math.sin(p*Math.PI)*.9;tag(cx,"z",bx+bw*.5+p*40+i*6,by-H*.02-p*90,14+p*14);}cx.globalAlpha=1;
  // warm overlay
  cx.fillStyle=`rgba(255,190,90,${.08*glow})`;cx.fillRect(0,0,W,H);
}
function bearFrame(dt,ts){
  if(state==="bed"){drawBedroom(dt);return;}
  drawRoom();
  if(state==="menu"){cx.fillStyle="rgba(15,8,45,.45)";cx.fillRect(0,0,W,H);const S=cs();cx.save();cx.translate(W*.3+Math.sin(tt*.6)*W*.15,H*.8);cx.scale(S*(Math.cos(tt*.6)>0?1:-1),S);drawPapaBear(cx,{t:tt,run:.6,blink:blinkAt(tt,1)});cx.restore();return;}
  if(!B.cub)return;
  if(state==="bear")bearUpdate(dt,ts);
  for(const it of B.items)drawBearItem(it);
  const ents=[B.cub,B.papa,B.mama,B.bro].sort((a,b)=>a.y-b.y);for(const e of ents)drawEnt(e);
  // night dim at the edges
  const v=cx.createRadialGradient(W/2,H*.55,H*.25,W/2,H*.55,H*.75);v.addColorStop(0,"rgba(10,5,40,0)");v.addColorStop(1,"rgba(10,5,40,.35)");cx.fillStyle=v;cx.fillRect(0,0,W,H);
}
function bearTarget(e){const S=cs();B.cub.tx=e.clientX;B.cub.ty=e.clientY+45*S;clampB({x:0,y:0});const t={x:B.cub.tx,y:B.cub.ty};clampB(t);B.cub.tx=t.x;B.cub.ty=t.y;}
cv.addEventListener("pointerdown",e=>{if(state!=="bear"||B.phase!=="play")return;B.dragging=true;bearTarget(e);e.preventDefault();});
window.addEventListener("pointermove",e=>{if(state==="bear"&&B.phase==="play"&&(B.dragging||e.pointerType==="mouse"))bearTarget(e);});
window.addEventListener("pointerup",()=>B.dragging=false);window.addEventListener("pointercancel",()=>B.dragging=false);

// ---------- Picker previews ----------
const pv={Derek:$("pvD").getContext("2d"),Elliot:$("pvE").getContext("2d")};
function drawPickers(){if($("start").classList.contains("hidden"))return;
  for(const k of ["Derek","Elliot"]){const c=pv[k],sd=k==="Derek"?0:1.7;c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,220,220);
    c.setTransform(2,0,0,2,0,0);c.translate(55,104+Math.sin(tt*3+sd)*-3);c.scale(.95,.95);
    drawKid(c,k,{t:tt+sd,bear:mode==="bear",blink:blinkAt(tt,sd),seed:sd,happy:((tt+sd)%5)<.9});}}

// ---------- Mode + wiring ----------
function pickText(){return twoP?"Who goes first?":mode==="bear"?"Who's the bear cub tonight?":"Who's catching stars today?";}
function setMode(m){mode=m;state="menu";$("mStar").classList.toggle("on",m==="star");$("mBear").classList.toggle("on",m==="bear");
  $("title").innerHTML=m==="bear"?"Derek <span class=\"amp\">&amp;</span> Elliot's<br>Huggle Bears":"Derek <span class=\"amp\">&amp;</span> Elliot's<br>Star Catch";
  $("pickMsg").textContent=pickText();$("tip").textContent=m==="bear"?"Drag the bear cub to huggle Mama and your brother. Tap Growl!":"Drag or tap to move. Catch everything you can!";
  document.title=m==="bear"?"Derek & Elliot's Huggle Bears":"Derek & Elliot's Star Catch";}
$("mStar").onclick=()=>{SFX.tap();stopLullaby();setMode("star");};
$("mBear").onclick=()=>{ac();SFX.cub();setMode("bear");};
function toMenu(){state="menu";stopLullaby();$("growl").classList.add("hidden");$("caption").classList.remove("on");B.phase="";show("start");}
document.querySelectorAll(".kid").forEach(b=>b.addEventListener("click",()=>{const k=b.dataset.kid;
  if(twoP){order=[k,k==="Derek"?"Elliot":"Derek"];results=[];turnIdx=0;}startAny(k);}));
$("twoP").onclick=()=>{twoP=!twoP;SFX.tap();$("twoP").textContent=twoP?"✅ Taking turns! Who goes first?":"👫 Take turns (2 players)";$("pickMsg").textContent=pickText();};
$("goNext").onclick=()=>startAny(order[1]);
$("again").onclick=()=>{if(twoP){results=[];startRound(order[0]);}else startRound(player.kid);};
$("menu").onclick=toMenu;
$("bedAgain").onclick=()=>{if(twoP){results=[];startBear(order[0]);}else startBear(B.kid);};
$("bedMenu").onclick=toMenu;

resize();player.x=player.tx=W/2;show("start");
setInterval(()=>{if(state==="menu"&&mode==="star"&&items.length<6)spawn();},900);
requestAnimationFrame(loop);
window.__game={startRound,startBear,setMode,doGrowl,get state(){return state},get score(){return score},get bear(){return B},
  caughtTest(){const it={t:TYPES[0],x:player.x,y:player.y,s:44,color:"#ffd23f"};for(let i=0;i<10;i++)caught(it);},
  huggleAll(){for(const e of [B.mama,B.bro])if(!e.joined)huggle(e);},skipBear(){B.endAt=0;B.tumble=0;}};
})();
</script>
